spring.application.name=labendicion
server.port=${PORT:8080}

# Perfil activo (Railway debe definir SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate (común)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optimizaciones Hibernate para performance
# Batch size para operaciones en lote (mejora N+1 queries)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Spring Boot Admin (Si aplica)
spring.boot.admin.client.url=http://localhost:8080

# === RESEND EMAIL ===
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM:La Bendicion Alertas <onboarding@resend.dev>}

# === GOOGLE OAUTH ===
# Copiar el Client ID de Google Cloud Console → APIs & Services → Credentials
google.client.id=${GOOGLE_CLIENT_ID:}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Salud para platform checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha





spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

