# Para Render: Conectarse a PostgreSQL de Supabase
# URL format: postgresql://username:password@host:port/database
spring.datasource.url=${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/labendicion}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.enabled=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://labendicion-beta.vercel.app}
