# Para Render: Usa H2 con archivo persistente
spring.datasource.url=jdbc:h2:file:./data/labendicion;MODE=PostgreSQL;TRACE_LEVEL_SYSTEM_OUT=0
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (desactiva en producción real)
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Swagger
springdoc.swagger-ui.enabled=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://labendicion-beta.vercel.app}
