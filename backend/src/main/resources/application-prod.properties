# PostgreSQL (Render/Railway)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PGUSER:}
spring.datasource.password=${PGPASSWORD:}

# JPA en producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optimizaciones Hibernate productivas (mayor batching para mejor perf)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Connection pool productivo (más conexiones para soportar concurrencia)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Evitar prepared statements server-side (supabase/pgbouncer): evita errores "prepared statement \"S_n\" already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# H2 off
spring.h2.console.enabled=false

# Swagger en prod (puedes poner false si no quieres exponerlo)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# CORS productivo (dominio de Vercel)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

