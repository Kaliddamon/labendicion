# Supabase PostgreSQL — la URL JDBC se construye en código (SupabaseDataSourceConfiguration).
# En Render: define DATABASE_URL con la URI de Supabase (postgresql://... o postgres://...).
# Opcional: PGUSER / PGPASSWORD si no van embebidos en la URI (la mayoría de URIs de Supabase ya llevan usuario y contraseña).
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Swagger
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://labendicion.vercel.app}




